name: E2E

# Los caminos críticos de Maestro sobre la app de verdad: backend y MySQL en el runner, build release del APK
# (el JS va dentro, sin Metro) y un emulador de Android. Va aparte del CI porque tarda bastante más (~23 min):
# corre al etiquetar una versión y a mano, no en cada push. Antes de etiquetar, en local: scripts/verificar.sh --e2e.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: forja
          MYSQL_USER: forja
          MYSQL_PASSWORD: forja-e2e
          MYSQL_ROOT_PASSWORD: raiz-e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Base de datos de usar y tirar del propio runner: estos valores no protegen nada.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PUERTO: '3306'
      MYSQL_DATABASE: forja
      MYSQL_USER: forja
      MYSQL_PASSWORD: forja-e2e
      MAESTRO_VERSION: 2.12.1
    steps:
      - name: Liberar disco
        # La build de Android y la imagen del emulador no caben en el disco del runner tal como viene.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Arrancar el backend
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          # Claves de un solo uso, generadas aquí: mueren con el runner.
          FORJA_JWT_KID_ACTUAL=e2e \
          FORJA_JWT_CLAVE_PRIVADA_ACTUAL="$(openssl genpkey -algorithm ed25519 -outform DER | base64 -w0)" \
          FORJA_CIFRADO_KID_ACTUAL=e2e \
          FORJA_CIFRADO_CLAVE_ACTUAL="$(openssl rand -base64 32)" \
          FORJA_CUENTA_EXIGIR_VERIFICACION=false \
            nohup java --enable-native-access=ALL-UNNAMED -jar target/forja-backend-*.jar > ../backend.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "El backend no arrancó" && tail -50 ../backend.log && exit 1

      - name: Cuenta de prueba con plan
        run: |
          correo="e2e-$(openssl rand -hex 4)@forja.test"
          contrasena="$(openssl rand -hex 12)"
          echo "::add-mask::$contrasena"
          api=http://localhost:8080/api/v1
          curl -sf -X POST "$api/auth/registro" -H 'Content-Type: application/json' \
            -d "{\"correo\":\"$correo\",\"contrasena\":\"$contrasena\",\"fechaNacimiento\":\"2000-01-01\"}" > /dev/null
          token=$(curl -sf -X POST "$api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"correo\":\"$correo\",\"contrasena\":\"$contrasena\",\"nombreDispositivo\":\"e2e\",\"plataforma\":\"movil\"}" \
            | jq -r .tokenAcceso)
          echo "::add-mask::$token"
          curl -sf -X POST "$api/rutinas/generar" -H 'Content-Type: application/json' -H "Authorization: Bearer $token" \
            -d '{"diasPorSemana":3,"minutosPorSesion":60,"material":["barra","mancuerna","maquina","polea","peso_corporal"]}' \
            > /dev/null
          { echo "CORREO=$correo"; echo "CONTRASENA=$contrasena"; } >> "$GITHUB_ENV"

      - name: Build release del APK
        working-directory: frontend
        env:
          # El emulador ve el localhost del runner en 10.0.2.2.
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          # Solo en esta build de prueba: la app habla con el backend del runner por HTTP.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q
          # Solo hace falta el APK: lo demás de Gradle y node_modules ocupa varios GB.
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/forja.apk"
          cd .. && rm -rf android node_modules ~/.gradle/caches
          df -h /

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Caminos críticos en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install "$RUNNER_TEMP/forja.apk"
            maestro test -e METRO=no -e CORREO="$CORREO" -e CONTRASENA="$CONTRASENA" --format junit --output maestro.xml frontend/.maestro/

      - name: Guardar registros si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-registros
          path: |
            backend.log
            maestro.xml
            ~/.maestro/tests/
          retention-days: 7
