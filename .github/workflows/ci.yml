name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una sola ejecución por rama: la nueva cancela la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Crear .env con valores ficticios
        # Rellena cada línea CLAVE= vacía (sin tocar comentarios ni líneas con valor).
        run: |
          cp .env.example .env
          sed -i -E 's/^([A-Za-z_][A-Za-z0-9_]*)=$/\1=ficticio/' .env
      - name: Validar docker-compose.yml con todos los perfiles
        run: docker compose --profile dev --profile gpu --profile obs config -q

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -no-color

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comprobar si hay código
        id: codigo
        working-directory: .
        run: |
          if [ -f backend/pom.xml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "backend: sin código todavía" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v6
        if: steps.codigo.outputs.existe == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar
        if: steps.codigo.outputs.existe == 'true'
        run: ./mvnw -B verify
      - name: El OpenAPI commiteado coincide con el generado
        # Lo escribe EspecificacionOpenApiTest durante verify; de él sale el cliente del frontend.
        if: steps.codigo.outputs.existe == 'true'
        run: git diff --exit-code -- ../docs/api/openapi.json

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database/catalogo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comprobar si hay código
        id: codigo
        working-directory: .
        run: |
          if [ -f database/catalogo/pyproject.toml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "database: sin código todavía" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.codigo.outputs.existe == 'true'
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        if: steps.codigo.outputs.existe == 'true'
        run: pip install -e ".[dev]"
      - name: Lint
        if: steps.codigo.outputs.existe == 'true'
        run: ruff check .
      - name: Tipos
        if: steps.codigo.outputs.existe == 'true'
        run: mypy --strict .
      - name: Tests con cobertura
        if: steps.codigo.outputs.existe == 'true'
        run: pytest --cov
      - name: La semilla SQL commiteada coincide con la generada
        if: steps.codigo.outputs.existe == 'true'
        run: |
          python generar.py
          git diff --exit-code -- ../../backend/src/main/resources/db/migration/R__catalogo_semilla.sql

  vision-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comprobar si hay código
        id: codigo
        working-directory: .
        run: |
          if [ -f vision-service/pyproject.toml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "vision-service: sin código todavía" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.codigo.outputs.existe == 'true'
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        if: steps.codigo.outputs.existe == 'true'
        run: pip install -e ".[dev]"
      - name: Tests
        if: steps.codigo.outputs.existe == 'true'
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comprobar si hay código
        id: codigo
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "frontend: sin código todavía" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.codigo.outputs.existe == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        if: steps.codigo.outputs.existe == 'true'
        run: npm ci
      - name: Lint
        if: steps.codigo.outputs.existe == 'true'
        run: npm run lint
      - name: Tipos
        if: steps.codigo.outputs.existe == 'true'
        run: npx tsc --noEmit
      - name: Tests con cobertura
        # El umbral (80 %) está en package.json; cuenta también los archivos que ningún test importa.
        if: steps.codigo.outputs.existe == 'true'
        run: npm test -- --coverage --coverageReporters=text-summary
      - name: Los tipos generados coinciden con el OpenAPI
        if: steps.codigo.outputs.existe == 'true'
        run: |
          npm run api
          git diff --exit-code -- src/api/esquema.d.ts
