name: Seguridad

on:
  push:
    branches: [main]
    # Cambios solo de documentación no lanzan el escaneo.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Una sola ejecución por rama: la nueva cancela la anterior (ahorra minutos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Crear .env con valores ficticios
        run: |
          cp .env.example .env
          sed -i -E 's/^([A-Za-z_][A-Za-z0-9_]*)=$/\1=ficticio/' .env
      # Solo informa: son imágenes de terceros para desarrollo local y aun en su último parche traen HIGH que solo
      # arregla su autor (Go viejo en gosu, mysqlsh, etc.; 2026-11-26). Las versiones las sube Dependabot.
      - name: Trivy sobre las imágenes del compose
        run: |
          while read -r imagen; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.76.2 \
              image --severity HIGH,CRITICAL --ignore-unfixed "$imagen"
          done < <(docker compose --profile dev --profile gpu --profile obs config --images)
      # La imagen propia es la que va a Azure: aquí sí bloquea.
      - name: Trivy sobre la imagen del backend
        run: |
          docker build -q -t forja-backend:ci backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 forja-backend:ci
      - name: Trivy sobre el repo (secretos y configuración)
        run: >
          docker run --rm -v "$PWD":/repo -w /repo aquasec/trivy:0.76.2
          fs --offline-scan --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

  codeql:
    # En repos privados CodeQL exige GitHub Advanced Security: solo corre si el repo es público.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

# OWASP ZAP baseline todavía no va: necesita el backend levantado en el CI.
