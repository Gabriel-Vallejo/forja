# Entra con la cuenta de prueba: maestro test -e CORREO=… -e CONTRASENA=… (nunca en el repo).
appId: io.github.gabrielvallejo.forja
---
- tapOn:
    text: Correo
    index: 1
- inputText: ${CORREO}
- tapOn:
    text: Contraseña
    index: 1
- inputText: ${CONTRASENA}
- hideKeyboard
- tapOn: Entrar
- extendedWaitUntil:
    visible: Tu semana
    timeout: 30000
