# Camino crítico 2: Mi plan → ejercicio → «Una serie más» → vista previa. Se descarta: no cambia la cuenta.
# «Una serie más» y no «menos»: el primer ejercicio puede estar ya en el mínimo de 2 series (y eso da un aviso).
appId: io.github.gabrielvallejo.forja
name: Vista previa de un ajuste
---
- runFlow: comun/abrir.yaml
- runFlow: comun/entrar.yaml
- tapOn: Entreno
- extendedWaitUntil:
    visible: Mi plan
    timeout: 20000
- tapOn: "01"
- extendedWaitUntil:
    visible: Por qué este ejercicio
    timeout: 20000
- scrollUntilVisible:
    element: Una serie más
    direction: DOWN
- tapOn: Una serie más
- extendedWaitUntil:
    visible: .*Aún no se ha guardado nada.*
    timeout: 30000
- assertVisible: Aplicar
- tapOn: Descartar
# La ficha puede ser larga (depende del ejercicio del día): se busca bajando, no se da por visible.
- scrollUntilVisible:
    element: Ajustar este ejercicio
    direction: DOWN
