  - {id: Front_Barbell_Squat, nombre_es: Sentadilla frontal con barra, patron: sentadilla, mecanica: compuesto, familia_sustitucion: sentadilla, implemento: barra, carga_axial: true, musculos_primarios: [cuadriceps], musculos_secundarios: [gluteos, isquiotibiales, abdominales]}
