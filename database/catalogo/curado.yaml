# Ejercicios básicos de gimnasio etiquetados A MANO sobre free-exercise-db (commit fijado en fuente.json).
# Lo curado manda sobre lo derivado (derivar.py). Todo queda con origen_etiquetado=curado y
# revisado=false: la revisión humana la hace Gabriel antes de fiarse de las etiquetas.
#
# Convenciones (las pone quien etiqueta; son decisiones propias, no de la fuente):
#   carga_axial        la carga pasa por la columna en vertical (de pie o en bisagra). Sentado con
#                      respaldo, tumbado y en máquina sin hombreras = false. Ante la duda, true.
#   por_encima_cabeza  los brazos van por encima de la cabeza durante el movimiento o en su inicio.
#   rango_movimiento   «reducido» = la variante limita el recorrido (tope mecánico, apoyo, altura).
#   posicion_estirada  true solo con evidencia (ver «fuente» en cada caso); si no, false.
#   regiones           si se omite, salen de patron + carga_axial (regiones_de en derivar.py).
#   materiales         si se omite, es solo el implemento.
# Referencias de posicion_estirada (ADR 0007, regla 3):
#   [Maeo 2021]  Maeo S et al., Med Sci Sports Exerc 2021, PMID 33009197: curl femoral sentado frente a tumbado.
#   [Maeo 2023a] Maeo S et al., Eur J Sport Sci 2023, PMID 35819335: tríceps con el brazo por encima de la cabeza.
#   [Maeo 2023b] Maeo S et al., Front Physiol 2023, PMID 38156065: gemelo de pie frente a sentado.
#   [Kassiano 2026] Kassiano W et al., J Strength Cond Res 2026, PMID 41379528: extensión de rodilla y recto femoral.
#   [Curl 2026]  J Sports Sci 2026, PMID 42829982: curl inclinado frente a predicador (bíceps +22,1 % vs +18,9 %).
#   [Pedrosa 2026] Pedrosa y cols., Sports Med Int Open 2026, PMID 41777276: la ventaja de las longitudes largas
#                aparece cuando hay par externo relevante con el músculo estirado. Evidencia INDIRECTA (sin
#                ensayo del ejercicio concreto): aperturas con mancuernas y peso muerto rumano.

por_defecto:
  carga_axial: false
  impacto: false
  agarre: ninguno
  lateralidad: bilateral
  por_encima_cabeza: false
  posicion_estirada: false
  rango_movimiento: completo
  apto_fuerza: true

