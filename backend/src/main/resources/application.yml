# Los valores salen de las variables MYSQL_* del .env (ver .env.example). Nada de secretos aquí.
forja:
  jwt:
    kid-actual: ${FORJA_JWT_KID_ACTUAL}
    clave-privada-actual: ${FORJA_JWT_CLAVE_PRIVADA_ACTUAL}
    kid-anterior: ${FORJA_JWT_KID_ANTERIOR:}
    clave-publica-anterior: ${FORJA_JWT_CLAVE_PUBLICA_ANTERIOR:}
  cifrado:
    kid-actual: ${FORJA_CIFRADO_KID_ACTUAL}
    clave-actual: ${FORJA_CIFRADO_CLAVE_ACTUAL}
    claves-anteriores: ${FORJA_CIFRADO_CLAVES_ANTERIORES:}
  cuenta:
    exigir-verificacion: ${FORJA_CUENTA_EXIGIR_VERIFICACION:true}
  contrasenas-filtradas: ${FORJA_CONTRASENAS_FILTRADAS:}
  origen-web: ${FORJA_ORIGEN_WEB:}
  # Generador de la rutina con CP-SAT (ADR 0002). Los pesos, rangos y objetivos viven aquí, no en el código.
  rutina:
    pesos:
      cobertura-prioritarios: 5   # por serie doble (primario 2, secundario 1) de un músculo prioritario
      posicion-estirada: 2        # moderado: favorece la posición estirada sin mandar sobre el volumen (ADR 0007)
      variedad: 10                # por cada día de más que se repite un ejercicio (más de 2)
      fatiga: 2                   # por serie de básico pesado (compuesto con carga axial)
      serie-hasta-objetivo: 10    # premio por serie doble de un músculo hasta su objetivo
      serie-sobre-objetivo: 3     # penalización suave por serie doble por encima (o de un músculo sin meta)
      serie-compuesto: 4          # premio por serie de compuesto; mayor que la fatiga
      holgura-volumen: 100        # por serie doble que falta para el mínimo
      holgura-frecuencia: 300     # por día que falta para la frecuencia mínima
      holgura-basicos: 500        # por patrón principal que falta en la semana
      desequilibrio-sesiones: 5   # por minuto entre la sesión más larga y la más corta
      movilidad: 0                # sin datos todavía (tests de movilidad)
      palancas: 0                 # sin datos todavía (fase 2)
    volumen:
      # Heurística de entrenadores (RP), nivel H: ver docs/referencias.md.
      minimo: 10
      objetivo: 14
      maximo: 20
      musculos-con-minimo: [pecho, dorsales, espalda_media, hombros, cuadriceps, isquiotibiales, gluteos, biceps, triceps, gemelos]
      por-musculo: {}
    basicos:
      # Cada uno, al menos una vez por semana con un compuesto (meta con holgura).
      patrones: [sentadilla, bisagra, empuje_horizontal, empuje_vertical, traccion_horizontal, traccion_vertical]
    tiempos:
      segundos-por-serie: 40
      segundos-de-descanso: 90
      segundos-de-transicion: 120
    sesion:
      series-minimas-por-ejercicio: 2
      series-maximas-por-ejercicio: 5
      ejercicios-minimos: 3
      ejercicios-maximos: 8
      maximo-por-patron: 2
      porcentaje-minimo-del-tiempo: 50   # ninguna sesión por debajo, salvo que falten candidatos
    solver:
      tiempo-determinista: 1.0              # segundos «deterministas» de CP-SAT, no de reloj (ADR 0002, enmienda)
      tiempo-determinista-alternativas: 0.2 # cada re-resolución del «por qué este y no aquel»
      workers: 1                 # con 1 la búsqueda es determinista sin intercalar, y en este modelo va más rápido
      semilla: 42
  # Plan versionado: objetivos por defecto de cada ejercicio y regla de la siguiente sesión (ADR 0008 §5).
  progresion:
    compuestos: {repeticiones-min: 6, repeticiones-max: 10, rir: 2}
    aislados: {repeticiones-min: 10, repeticiones-max: 15, rir: 1}
    # kg que sube la carga si se completa el rango alto al RIR objetivo en todas las series de trabajo.
    # Con peso corporal es 0: se progresa por repeticiones. Barra EZ y polea, como barra y máquina; el resto, 0.
    incrementos-kg:
      barra: 2.5
      barra_ez: 2.5
      mancuerna: 2.0
      kettlebell: 2.0
      maquina: 5.0
      polea: 5.0
      peso_corporal: 0
    incremento-por-defecto-kg: 0
    # RF-26: sin mejorar el e1RM durante `semanas` (con al menos `sesiones-minimas`), la siguiente sesión es un deload.
    deload:
      semanas: 3
      sesiones-minimas: 3
      mejora-minima-porcentaje: 1.0  # el mejor e1RM de la ventana tiene que superar en más de esto al anterior
      factor-carga: 0.9
      factor-series: 0.5             # la mitad, redondeando hacia arriba
      redondeo-kg: 0.5
    e1rm-repeticiones-maximas: 12    # Epley no es fiable por encima: esas series no cuentan
    peso-corporal-tope-repeticiones: 20
    series-por-defecto: 3
spring:
  application:
    name: forja-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PUERTO:3308}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo manda Flyway; Hibernate solo comprueba que las entidades casan.
      ddl-auto: validate
  flyway:
    enabled: true
# OpenAPI (springdoc): apagado por defecto. Solo el perfil dev sirve /v3/api-docs y Swagger UI
# (application-dev.yml). El archivo docs/api/openapi.json lo escribe un test, no el servidor.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
