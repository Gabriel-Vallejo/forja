# Perfiles:
#   dev  -> MySQL 8.4 (backend, vision-service y frontend se añadirán aquí cuando existan).
#   gpu  -> Ollama en contenedor con la GPU NVIDIA (necesita NVIDIA Container Toolkit). Solo para
#           máquinas sin Ollama nativo; en el portátil de desarrollo se usa el nativo (127.0.0.1:11434).
#   obs  -> Prometheus + Grafana.
# Todos los puertos van atados a 127.0.0.1.
name: forja

services:
  mysql:
    image: mysql:8.4.13
    profiles: [dev]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?falta MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?falta MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?falta MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql-datos:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PUERTO:-3308}:3306"
    healthcheck:
      # Comprueba que el servidor está vivo, no las credenciales, y así la contraseña no sale en `ps`.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:0.40.16
    profiles: [gpu]
    volumes:
      - ollama-modelos:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PUERTO:-11435}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-datos:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [obs]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-forja}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?falta GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-datos:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mysql-datos:
  ollama-modelos:
  prometheus-datos:
  grafana-datos:
